services:
  - type: web
    name: urbaneye-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run deploy:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: urbaneye-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: urbaneye-redis
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: urbaneye-ai
          property: hostport
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: urbaneye-ai
    runtime: python
    rootDir: ai_service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_TEMPERATURE
        value: "0.2"

  - type: redis
    name: urbaneye-redis
    plan: free
    ipAllowList: []

databases:
  - name: urbaneye-db
    plan: free
    databaseName: civic_db
    user: urbaneye
